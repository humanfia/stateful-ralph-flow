[project]
name = "stateful-ralph-flow"
version = "0.1.0"
description = 'The Ralph loop with memory, as an hmz flow: the task again and again in one session that remembers every round.'
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []

[project.urls]
Repository = "https://github.com/humanfia/stateful-ralph-flow"
Issues = "https://github.com/humanfia/stateful-ralph-flow/issues"

[dependency-groups]
dev = [
    "hmz @ git+https://github.com/humanfia/humanize",
    "pytest>=8",
    "pytest-asyncio>=1.4.0",
    "pytest-timeout>=2.3",
    "ruff>=0.16.5",
]

[tool.uv]
# The flow is a directory hmz imports, not a package anybody installs.
package = false

[tool.pytest.ini_options]
addopts = ["--strict-markers", "--strict-config", "-ra"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
timeout = 300

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
# The formatter owns line length; prose it cannot split is left as written.
ignore = ["E501"]
